name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options: [rocm, cuda, mps, cpu, docker, not sure]
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and install method
      placeholder: "Ubuntu 24.04 / macOS 15 / Windows 11 + WSL2; uv tool install, pip, docker"
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `clef doctor --json`
      render: json
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps or request to reproduce
      description: Do not paste API keys.
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines (`clef logs -n 100`)
      render: text
