name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: checks (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10", lock: cpu }
          - { os: ubuntu-latest, python: "3.12", lock: cpu }
          - { os: macos-14, python: "3.12", lock: macos }
          - { os: windows-latest, python: "3.12", lock: cpu }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements/*.txt
            pyproject.toml

      - name: Install CPU torch from the lock file, then the package (torch is not re-resolved)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/${{ matrix.lock }}.txt
          pip install -e ".[server,dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: Unit tests (CPU, no model weights)
        run: python -m pytest tests/unit -q

      - name: openapi.json is up to date
        run: python scripts/export_openapi.py --check

      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build

      - name: CLI smoke from the built wheel in a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="$RUNNER_TEMP/smoke/Scripts"; else BIN="$RUNNER_TEMP/smoke/bin"; fi
          "$BIN/python" -m pip install --upgrade pip
          "$BIN/pip" install -r requirements/${{ matrix.lock }}.txt
          WHEEL="$(ls "$PWD"/dist/*.whl | head -n1)"
          "$BIN/pip" install "${WHEEL}[server]"
          cd "$RUNNER_TEMP"
          "$BIN/clef" --help
          "$BIN/clef" version
          "$BIN/clef" doctor --no-gpu

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  js-client:
    name: js client (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test clients/js/test/client.test.js

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck scripts/*.sh
        run: shellcheck scripts/*.sh

  docker:
    name: docker build (${{ matrix.backend }}, no push)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        backend: [cuda, rocm]
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (GPU images are large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.backend }}
          push: false
          cache-from: type=gha,scope=${{ matrix.backend }}
          cache-to: type=gha,scope=${{ matrix.backend }},mode=max
