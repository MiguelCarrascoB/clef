site_name: clef
site_description: Local server, CLI, clients and web console for Cloudflare's clef-flash decision model.
site_url: https://miguelcarrascob.github.io/clef/
repo_url: https://github.com/MiguelCarrascoB/clef
repo_name: MiguelCarrascoB/clef
edit_uri: edit/main/docs/
copyright: Apache-2.0 licensed. The model is Cloudflare clef-flash.

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - toc.follow

extra_css:
  - assets/extra.css

exclude_docs: |
  prompts/
  hooks/

hooks:
  - docs/hooks/clef_docs.py

plugins:
  - search
  - swagger-ui-tag:
      background: White
      syntaxHighlightTheme: monokai
      docExpansion: list
      filter: true
      tryItOutEnabled: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MiguelCarrascoB/clef

nav:
  - Home: index.md
  - Getting started:
      - Install: getting-started.md
      - First request: first-request.md
  - Guides:
      - Classification: classification.md
      - OpenAI & Hugging Face compatibility: openai-compat.md
      - Evaluation: evaluation.md
      - Jobs & webhooks: jobs.md
      - Smaller GPUs: memory.md
      - Remote access: remote-access.md
      - Console: console.md
  - Reference:
      - CLI: cli.md
      - Configuration: configuration.md
      - HTTP API: api-reference.md
      - Architecture: ARCHITECTURE.md
  - Operations:
      - Troubleshooting: troubleshooting.md
      - Hardware validation: hardware-validation.md
      - Hardware results: hardware-results.md
      - Performance: performance.md
  - Project:
      - Contributing: contributing.md
      - Security: security.md
      - Changelog: changelog.md
      - License: license.md
